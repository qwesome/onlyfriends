<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OnlyFriends</title>
  <link rel="icon" href="static/favicon.png" type="image/png">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #222;
      padding: 10px 20px;
    }
    header img {
      height: 60px;
    }
    header a button {
      padding: 8px 12px;
      font-size: 14px;
      background-color: #000;
      color: #fff;
      border: 1px solid #555;
      cursor: pointer;
    }
    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #555;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #111;
    }
    #input {
      display: flex;
    }
    #input input {
      flex: 1;
      padding: 8px;
      font-size: 14px;
      background-color: #000;
      color: #fff;
      border: 1px solid #555;
    }
    #input button {
      padding: 8px 12px;
      font-size: 14px;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <img src="static/logo.png" alt="Logo">
    <a href="https://onlyfans.com/" target="_blank">
      <button>Log in / Sign up</button>
    </a>
  </header>

  <div id="chat-container">
    <div id="chat"></div>
    <div id="input">
      <input type="text" id="message" placeholder="Type your message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById('message');
      const chat = document.getElementById('chat');
      const text = input.value.trim();
      if (text === '') return;

      const youMsg = document.createElement('div');
      youMsg.textContent = 'You: ' + text;
      chat.appendChild(youMsg);
      chat.scrollTop = chat.scrollHeight;

      input.value = '';

      const delay = Math.floor(Math.random() * 2000) + 3000;
      setTimeout(() => {
        const reply = document.createElement('div');
        reply.textContent = 'Anonymous: This is for demonstrative purposes only. In reality, this would be a random user. I cannot legally share my Deepseek API key to anyone, but AI works here.';
        chat.appendChild(reply);
        chat.scrollTop = chat.scrollHeight;
      }, delay);
    }

    document.getElementById('message').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>

</body>
</html>
